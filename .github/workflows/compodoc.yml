name: Publicar Documentación (Front + Back + API)

on:
  push:
    branches:
      - Frontend
      - Backend
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Crear estructura
        run: mkdir -p docs-finales/frontend docs-finales/backend docs-finales/api

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias Frontend
        run: cd Frontend/JuegoRolPagina && npm install

      - name: Generar Compodoc
        run: cd Frontend/JuegoRolPagina && npx @compodoc/compodoc -p tsconfig.json -d ../../docs-finales/frontend

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generar Dokka
        run: |
          cd Backend
          chmod +x gradlew
          ./gradlew dokkaGenerateHtml
          cp -r build/dokka/html/* ../docs-finales/backend/

      - name: Extraer OpenAPI y crear Web Estática
        run: |
          cd Backend
          ./gradlew generateOpenApiDocs
          npx @redocly/cli build-docs build/openapi.json -o ../docs-finales/api/index.html

      - name: Crear Índice
        run: |
          echo "<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><title>Documentación Juego de Rol</title><style>body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; padding: 50px; } .btn { display: inline-block; padding: 15px 30px; margin: 10px; text-decoration: none; color: white; background-color: #007bff; border-radius: 8px; font-weight: bold; } .btn-back { background-color: #28a745; } .btn-api { background-color: #dc3545; }</style></head><body><h1>📚 Documentación del Proyecto</h1><div><a class='btn' href='./frontend/'>💻 Ver Documentación Frontend (Angular)</a><a class='btn btn-back' href='./backend/'>⚙️ Ver Documentación Backend (Kotlin)</a><a class='btn btn-api' href='./api/'>🔌 Ver Documentación API (Swagger)</a></div></body></html>" > docs-finales/index.html

      - name: Configurar Páginas
        uses: actions/configure-pages@v5

      - name: Subir la documentación unificada
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs-finales'

      - name: Publicar en Internet
        id: deployment
        uses: actions/deploy-pages@v4