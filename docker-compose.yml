services:
  base-de-datos:
    image: mysql:9.6.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - datos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/whitecatmaster/hondius-backend:produccion
    build:
      context: ./Backend
      dockerfile: Dockerfile
    depends_on:
      base-de-datos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://base-de-datos:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      FIREBASE_CREDENTIALS_PATH: /app/firebase-adminsdk.json
    volumes:
      - ./Backend/src/main/resources/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro,Z
    expose:
      - "8081"
    restart: unless-stopped

  frontend:
    image: ghcr.io/whitecatmaster/hondius-frontend:produccion
    build:
      context: ./Frontend/JuegoRolPagina
      dockerfile: Dockerfile
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - backend
    volumes:
      - ./Backend/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - datos_prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    expose:
      - "9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - datos_grafana:/var/lib/grafana
      - ./Backend/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./Backend/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  datos_mysql:
  datos_prometheus:
  datos_grafana:
  caddy_data:
  caddy_config:
